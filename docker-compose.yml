services:
  postgres:
    image: postgres:16-alpine
    container_name: zoolyum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zoolyum
      POSTGRES_PASSWORD: zoolyum
      POSTGRES_DB: zoolyum_os
    ports:
      - "5434:5432"
    volumes:
      - zoolyum_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoolyum -d zoolyum_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zoolyum-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zoolyum_pgdata:
